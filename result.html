<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Date?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      background: #f3eeee;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    h1 {
      color: #a73a3a;
      font-size: 44px;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 35px;
      text-shadow:
        1px 1px 0 #fff,
        2px 2px 0 rgba(120, 0, 0, 0.25);
    }

    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80px;
      margin-bottom: 70px;
    }

    button {
      border: none;
      color: white;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      font-weight: bold;
      padding: 14px 46px;
      border-radius: 12px;
      cursor: pointer;
      background: linear-gradient(135deg, #20d6bd, #006b4f);
      box-shadow:
        inset 0 2px 5px rgba(255, 255, 255, 0.5),
        0 8px 0 rgba(0, 0, 0, 0.18),
        0 12px 18px rgba(0, 0, 0, 0.18);
      transition: transform 0.25s ease;
    }

    button:hover {
      transform: scale(1.08);
    }

    button:active {
      box-shadow:
        inset 0 2px 5px rgba(255, 255, 255, 0.5),
        0 3px 0 rgba(0, 0, 0, 0.18),
        0 7px 12px rgba(0, 0, 0, 0.18);
    }

    .cat {
      width: 330px;
      height: 220px;
      position: relative;
      margin-top: 10px;
    }

    .cat-body {
      width: 320px;
      height: 170px;
      background: #10a9d4;
      border: 6px solid #1b1b1b;
      border-radius: 48% 48% 38% 38%;
      position: absolute;
      bottom: 0;
      left: 5px;
    }

    .cat-body::before,
    .cat-body::after {
      content: "";
      position: absolute;
      width: 86px;
      height: 86px;
      background: #10a9d4;
      border: 6px solid #1b1b1b;
      top: -58px;
      z-index: -1;
    }

    .cat-body::before {
      left: 35px;
      border-radius: 20px 70px 20px 70px;
      transform: rotate(18deg);
    }

    .cat-body::after {
      right: 35px;
      border-radius: 70px 20px 70px 20px;
      transform: rotate(-18deg);
    }

    .face {
      position: absolute;
      width: 100%;
      top: 64px;
      left: 0;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 56px;
      font-weight: bold;
      color: #1b1b1b;
      letter-spacing: 20px;
    }

    .blush {
      position: absolute;
      width: 22px;
      height: 36px;
      top: 98px;
      background: repeating-linear-gradient(
        90deg,
        #e96f78 0,
        #e96f78 4px,
        transparent 4px,
        transparent 9px
      );
      opacity: 0.75;
    }

    .blush.left {
      left: 58px;
      transform: rotate(10deg);
    }

    .blush.right {
      right: 58px;
      transform: rotate(-10deg);
    }

    .belly {
      position: absolute;
      width: 120px;
      height: 52px;
      background: rgba(255, 255, 255, 0.38);
      border-radius: 60% 60% 0 0;
      bottom: 0;
      left: 100px;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 31px;
        margin-bottom: 28px;
      }

      button {
        font-size: 25px;
        padding: 12px 38px;
      }

      .buttons {
        margin-bottom: 55px;
      }

      .cat {
        width: 290px;
        height: 200px;
      }

      .cat-body {
        width: 280px;
        height: 155px;
      }

      .face {
        font-size: 46px;
        top: 58px;
      }

      .belly {
        left: 86px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <h1>你要和我去約會嗎？</h1>

    <div class="buttons">
      <button id="yesBtn">YES</button>
    </div>

    <div class="cat">
      <div class="cat-body">
        <div class="face">&gt;ω&lt;</div>
        <div class="blush left"></div>
        <div class="blush right"></div>
        <div class="belly"></div>
      </div>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");

    yesBtn.addEventListener("click", function () {
      window.location.href = "date.html";
    });
  </script>
</body>
</html>
